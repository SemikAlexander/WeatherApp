# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Параллельная сборка и конфигурирование по требованию (ускорение многократных сборок)
org.gradle.parallel=true
org.gradle.configureondemand=true
android.useAndroidX=true
# Jetifier отключён: все зависимости используют AndroidX; включение замедляет конфигурацию
android.enableJetifier=false
kotlin.code.style=official
# Версии зависимостей — только из gradle/libs.versions.toml (Version Catalog)
