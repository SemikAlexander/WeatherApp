# Каталог версий зависимостей (Gradle Version Catalog).
# Обновление библиотек — в одном месте; синхронизация версий плагинов и зависимостей гарантируется одним alias.

[versions]
# Инструментальный стек
agp = "8.13.2"                       # Android Gradle Plugin (требует Gradle >= 8.13)
kotlin = "2.1.21"                    # Язык + KGP; Compose-плагин завязан на эту версию
composeBom = "2026.09.00"            # BOM: согласованные версии всех compose-артефактов без явных номеров
coroutines = "1.11.0"

# AndroidX
coreKtx = "1.17.0"                   # compileSdk 36; 1.19.x требует minSdk 24, у нас minSdk 23
appcompat = "1.7.1"
material = "1.13.0"
constraintlayout = "2.2.1"
fragmentKtx = "1.8.9"
lifecycle = "2.9.4"                  # lifecycle-* (viewmodel/livedata/runtime)
navigation = "2.9.6"                 # nav-fragments-ktx (View-навигация)
activityCompose = "1.10.1"           # совместима с compose-ui 1.12.x из BOM и appcompat 1.7.x (minSdk 23)
coil = "2.7.0"
swiperefreshlayout = "1.1.0"
legacySupportV4 = "1.0.0"

# DI
hilt = "2.56.1"                      # стабильная, официально поддерживает KAPT; 2.59.x ориентирован на KSP

# Сеть
retrofit = "2.12.0"
okhttp = "4.12.0"                    # OkHttp 5.x стабилен, но оставил 4.12.0: минимальный риск для существующего кода (Interceptor API)

# Тесты
junit = "4.13.2"
androidxTestJunit = "1.2.1"          # 1.3.x требует minSdk 24
espresso = "3.6.1"

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-legacy-support-v4 = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "legacySupportV4" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }

androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# Compose (версии берёт из BOM — без version.ref)
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# DI
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# Сеть
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Изображения
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Скелетоны загрузки (JitPack)
agskeleton-loading = { group = "com.github.AgnaldoNP", name = "AGSkeletonLoading", version = "1.2" }

# Тесты
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
