# Каталог версий зависимостей (Gradle Version Catalog).
# Обновление библиотек — в одном месте; синхронизация версий плагинов и зависимостей гарантируется одним alias.

[versions]
# Инструментальный стек
agp = "8.13.2"                       # Android Gradle Plugin (требует Gradle >= 8.13)
kotlin = "2.1.21"                    # Язык + KGP; Compose-плагин завязан на эту версию
# ВАЖНО: BOM 2026.09.00 тянет Compose 1.12.x, который требует compileSdk 37 и AGP >= 9.1.0.
# Пока проект на AGP 8.13.x / compileSdk 36, используем последний BOM линейки Compose 1.9.x.
# Миграция на AGP 9.x + SDK 37 — отдельная задача (смена major AGP ломает часть DSL).
composeBom = "2025.09.00"             # BOM: Compose 1.9.x — совместим с AGP 8.13 / compileSdk 36
coroutines = "1.11.0"

# AndroidX
coreKtx = "1.17.0"                   # compileSdk 36; 1.19.x требует minSdk 24, у нас minSdk 23
lifecycle = "2.9.4"                  # lifecycle-* (viewmodel/livedata/runtime-ktx)
activityCompose = "1.10.1"           # совместима с compose-ui 1.12.x из BOM и appcompat 1.7.x (minSdk 23)
navigationCompose = "2.9.6"          # Compose Navigation (single-activity + nav-compose)
hiltNavigationCompose = "1.2.0"      # hiltViewModel() внутри composable
coil = "2.7.0"

# DI
hilt = "2.56.1"                      # стабильная; 2.56+ полностью поддерживает KSP — kapt удалён

# Сеть
retrofit = "2.12.0"
okhttp = "4.12.0"                    # OkHttp 5.x стабилен, но оставил 4.12.0: минимальный риск для существующего кода (Interceptor API)

# Тесты
junit = "4.13.2"
androidxTestJunit = "1.2.1"          # 1.3.x требует minSdk 24
espresso = "3.6.1"

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Compose (версии берёт из BOM — без version.ref)
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# DI
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# Сеть
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Изображения
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Скелетоны загрузки (JitPack)

# Тесты
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version = "2.1.21-2.0.1" }  # KSP: версия = <kotlin>-<KSP release>
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
